# STUDYAI Enterprise Production Nginx Configuration
# Multi-Domain TLS Termination, Strict Security Headers & Rate Limiting

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. API Gateway: api.studyai.com
    server {
        listen 443 ssl http2;
        server_name api.studyai.com;

        ssl_certificate /etc/letsencrypt/live/studyai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/studyai.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://fastapi_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://fastapi_backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 2. Student Portal: studyai.com
    server {
        listen 443 ssl http2;
        server_name studyai.com www.studyai.com;

        ssl_certificate /etc/letsencrypt/live/studyai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/studyai.com/privkey.pem;

        location / {
            proxy_pass http://student_app:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # 3. School Admin Portal: admin.studyai.com
    server {
        listen 443 ssl http2;
        server_name admin.studyai.com;

        ssl_certificate /etc/letsencrypt/live/studyai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/studyai.com/privkey.pem;

        location / {
            proxy_pass http://admin_portal:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # 4. Super Admin Console: superadmin.studyai.com
    server {
        listen 443 ssl http2;
        server_name superadmin.studyai.com;

        ssl_certificate /etc/letsencrypt/live/studyai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/studyai.com/privkey.pem;

        location / {
            proxy_pass http://superadmin_portal:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # 5. Global HTTP -> HTTPS Redirection
    server {
        listen 80;
        server_name studyai.com *.studyai.com;
        return 301 https://$host$request_uri;
    }
}

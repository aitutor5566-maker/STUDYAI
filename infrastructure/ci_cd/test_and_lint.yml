name: CI - Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest-cov

      - name: Lint with Ruff
        run: ruff check backend/

      - name: Run Pytest suite
        run: |
          export FEATURE_VIDEO_GENERATION=false
          pytest backend/tests -v --cov=backend/app

  frontend-tests:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: "stable"
          cache: true

      - name: Shared Packages Analysis
        run: |
          cd packages/shared_models && flutter pub get && flutter analyze
          cd ../shared_ui && flutter pub get && flutter analyze
          cd ../shared_services && flutter pub get && flutter analyze

      - name: Student App Analysis
        run: |
          cd apps/student_app
          flutter pub get
          flutter analyze

name: CD - Build & Deploy Containers

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build Multi-App Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Student App Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.student
          push: true
          tags: ghcr.io/${{ github.repository }}/student-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Admin Portal Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.admin
          push: true
          tags: ghcr.io/${{ github.repository }}/admin-portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Super Admin Portal Container (Isolated Pipeline)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.superadmin
          push: true
          tags: ghcr.io/${{ github.repository }}/superadmin-portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

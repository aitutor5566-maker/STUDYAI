<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1322"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgM)" rx="16"/>

  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">MATHEMATICS: RIGHT CIRCULAR CONE MENSURATION</text>
  <text x="300" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">ICSE Class 10 Mensuration: Slant Height, Curved Surface Area, and Volume</text>

  <!-- Circular Base Ellipse -->
  <ellipse cx="300" cy="310" rx="140" ry="36" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Cone Slant Sides -->
  <line x1="300" y1="100" x2="160" y2="310" stroke="#38bdf8" stroke-width="3"/>
  <line x1="300" y1="100" x2="440" y2="310" stroke="#38bdf8" stroke-width="3"/>

  <!-- Vertical Height (h) -->
  <line x1="300" y1="100" x2="300" y2="310" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="315" y="210" font-family="system-ui" font-size="16" font-weight="800" fill="#f87171">h (Height)</text>

  <!-- Base Radius (r) -->
  <line x1="300" y1="310" x2="440" y2="310" stroke="#22c55e" stroke-width="3"/>
  <circle cx="300" cy="310" r="4" fill="#f8fafc"/>
  <text x="370" y="335" font-family="system-ui" font-size="16" font-weight="800" fill="#4ade80">r (Radius)</text>

  <!-- Right Angle Symbol -->
  <rect x="300" y="295" width="15" height="15" fill="none" stroke="#facc15" stroke-width="2"/>

  <!-- Slant Height (l) -->
  <text x="205" y="200" font-family="system-ui" font-size="16" font-weight="800" fill="#38bdf8">l (Slant Height)</text>

  <!-- Formula Summary Card -->
  <rect x="50" y="365" width="500" height="65" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="300" y="390" font-family="system-ui" font-size="14" font-weight="800" fill="#facc15" text-anchor="middle">Pythagorean Relation: l = √(r² + h²)</text>
  <text x="300" y="414" font-family="system-ui" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Volume: V = (1/3)πr²h  |  Curved Surface Area: CSA = πrl  |  TSA = πr(l + r)</text>
</svg>

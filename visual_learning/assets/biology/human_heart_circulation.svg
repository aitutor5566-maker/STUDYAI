<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="raGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="rvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="laGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="lvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="700" height="520" fill="url(#bgGrad)" rx="16"/>

  <!-- Title Header -->
  <text x="350" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">HUMAN HEART: 4-CHAMBER ANATOMY &amp; DOUBLE CIRCULATION</text>
  <text x="350" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">ICSE Class 10 Biology Curriculum Benchmark (Patient Right is Viewer's Left)</text>

  <!-- Vena Cava -->
  <rect x="70" y="85" width="40" height="75" rx="6" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
  <text x="90" y="125" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">SVC</text>
  <text x="90" y="175" font-family="system-ui" font-size="10" fill="#93c5fd" text-anchor="middle">Vena Cava</text>

  <!-- Right Atrium (Deoxygenated) -->
  <rect x="130" y="90" width="180" height="140" fill="url(#raGrad)" stroke="#60a5fa" stroke-width="2" rx="12"/>
  <text x="220" y="150" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Right Atrium (RA)</text>
  <text x="220" y="175" font-family="system-ui" font-size="12" fill="#bfdbfe" text-anchor="middle">Receives Deoxygenated Blood</text>
  <text x="220" y="195" font-family="system-ui" font-size="11" fill="#93c5fd" text-anchor="middle">from Venae Cavae</text>

  <!-- SA Node (Natural Pacemaker) -->
  <circle cx="150" cy="110" r="14" fill="#facc15" filter="url(#glow)"/>
  <text x="150" y="114" font-family="system-ui" font-size="10" font-weight="900" fill="#854d0e" text-anchor="middle">SA</text>
  <text x="150" y="80" font-family="system-ui" font-size="10" font-weight="700" fill="#fef08a" text-anchor="middle">SA Node (72 bpm)</text>

  <!-- Left Atrium (Oxygenated) -->
  <rect x="390" y="90" width="180" height="140" fill="url(#laGrad)" stroke="#f87171" stroke-width="2" rx="12"/>
  <text x="480" y="150" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Left Atrium (LA)</text>
  <text x="480" y="175" font-family="system-ui" font-size="12" fill="#fecaca" text-anchor="middle">Receives Oxygenated Blood</text>
  <text x="480" y="195" font-family="system-ui" font-size="11" fill="#fca5a5" text-anchor="middle">from 4 Pulmonary Veins</text>

  <!-- Pulmonary Veins Ingress -->
  <rect x="590" y="85" width="40" height="75" rx="6" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
  <text x="610" y="125" font-family="system-ui" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">PV</text>
  <text x="610" y="175" font-family="system-ui" font-size="10" fill="#fca5a5" text-anchor="middle">Pulm Vein</text>

  <!-- Interatrial / Interventricular Septum -->
  <rect x="325" y="80" width="50" height="360" rx="8" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="350" y="270" font-family="system-ui" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle" transform="rotate(-90 350 270)">SEPTUM (Prevents Mixing)</text>

  <!-- Tricuspid Valve -->
  <rect x="180" y="240" width="80" height="26" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="220" y="258" font-family="system-ui" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">Tricuspid Valve</text>

  <!-- Bicuspid / Mitral Valve -->
  <rect x="440" y="240" width="80" height="26" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="258" font-family="system-ui" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">Bicuspid / Mitral</text>

  <!-- Right Ventricle (Pulmonary Pump) -->
  <rect x="130" y="275" width="180" height="150" fill="url(#rvGrad)" stroke="#60a5fa" stroke-width="2" rx="12"/>
  <text x="220" y="340" font-family="system-ui" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Right Ventricle (RV)</text>
  <text x="220" y="365" font-family="system-ui" font-size="12" fill="#bfdbfe" text-anchor="middle">Pumps to Pulmonary Artery</text>
  <text x="220" y="385" font-family="system-ui" font-size="11" fill="#93c5fd" text-anchor="middle">(Lower Pressure Circuit)</text>

  <!-- Left Ventricle (Systemic Pump - Thickest Myocardium) -->
  <rect x="390" y="275" width="180" height="150" fill="url(#lvGrad)" stroke="#fb7185" stroke-width="5" rx="12"/>
  <text x="480" y="340" font-family="system-ui" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Left Ventricle (LV)*</text>
  <text x="480" y="365" font-family="system-ui" font-size="12" fill="#ffe4e6" text-anchor="middle">Thickest Muscular Wall (3×)</text>
  <text x="480" y="385" font-family="system-ui" font-size="11" fill="#fecdd3" text-anchor="middle">Pumps to Aorta (High Pressure)</text>

  <!-- Flow Direction Arrows -->
  <path d="M 220 200 L 220 235" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 480 200 L 480 235" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>

  <!-- Footer Mnemonic & Rule Banner -->
  <rect x="40" y="455" width="620" height="45" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="350" y="475" font-family="system-ui" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">LORD MNEMONIC: Left = Oxygenated | Right = Deoxygenated</text>
  <text x="350" y="492" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">TRI before you BI: Step on Tricuspid (Right) before reaching Bicuspid (Left) | Arteries = Away</text>
</svg>

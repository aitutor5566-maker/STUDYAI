<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="700" height="400" fill="url(#bgP)" rx="16"/>

  <text x="350" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">PHYSICS: PRINCIPLE OF MOMENTS &amp; ROTATIONAL EQUILIBRIUM</text>
  <text x="350" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">ICSE Class 10 Physics Chapter 1 Benchmark: Sum of Clockwise Moments = Sum of Anticlockwise Moments</text>

  <!-- Rigid Meter Rule (Beam) -->
  <rect x="80" y="170" width="540" height="24" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>

  <!-- Centimeter markings -->
  <line x1="140" y1="170" x2="140" y2="182" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="200" y1="170" x2="200" y2="182" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="260" y1="170" x2="260" y2="182" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="350" y1="170" x2="350" y2="194" stroke="#facc15" stroke-width="3"/>
  <line x1="440" y1="170" x2="440" y2="182" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="530" y1="170" x2="530" y2="182" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Central Fulcrum / Pivot -->
  <polygon points="350,194 320,270 380,270" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="350" cy="194" r="5" fill="#facc15"/>
  <text x="350" y="295" font-family="system-ui" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">Fulcrum (Pivot at 50 cm mark)</text>

  <!-- Force F1 (Anticlockwise load) -->
  <rect x="150" y="90" width="60" height="80" rx="6" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
  <text x="180" y="130" font-family="system-ui" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">F₁</text>
  <text x="180" y="152" font-family="system-ui" font-size="11" fill="#fecaca" text-anchor="middle">20 N</text>

  <!-- Distance d1 arrow -->
  <line x1="180" y1="210" x2="350" y2="210" stroke="#f87171" stroke-width="3"/>
  <text x="265" y="230" font-family="system-ui" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="middle">d₁ = 30 cm (0.30 m)</text>

  <!-- Force F2 (Clockwise effort) -->
  <rect x="490" y="115" width="60" height="55" rx="6" fill="#16a34a" stroke="#4ade80" stroke-width="2"/>
  <text x="520" y="145" font-family="system-ui" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">F₂</text>
  <text x="520" y="162" font-family="system-ui" font-size="11" fill="#dcfce7" text-anchor="middle">10 N</text>

  <!-- Distance d2 arrow -->
  <line x1="350" y1="210" x2="520" y2="210" stroke="#4ade80" stroke-width="3"/>
  <text x="435" y="230" font-family="system-ui" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle">d₂ = 60 cm (0.60 m)</text>

  <!-- Moment calculation banner -->
  <rect x="60" y="325" width="580" height="55" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="350" y="347" font-family="system-ui" font-size="13" font-weight="800" fill="#facc15" text-anchor="middle">τ₁ (Anticlockwise) = F₁ × d₁ = 20 N × 0.30 m = 6.0 N·m</text>
  <text x="350" y="367" font-family="system-ui" font-size="13" font-weight="800" fill="#4ade80" text-anchor="middle">τ₂ (Clockwise) = F₂ × d₂ = 10 N × 0.60 m = 6.0 N·m  (Στ = 0: Static Rotational Equilibrium)</text>
</svg>

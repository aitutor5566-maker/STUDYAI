<svg viewBox="0 0 750 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="750" height="420" fill="url(#bgH)" rx="16"/>

  <text x="375" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">HISTORY: CAUSES OF THE FIRST WORLD WAR (1882–1914)</text>
  <text x="375" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a1a1aa" text-anchor="middle">ICSE Class 10 History: M-A-I-N Factors, Opposing Alliance Blocs &amp; Sarajevo Crisis</text>

  <!-- M-A-I-N Framework Pillars -->
  <rect x="50" y="85" width="150" height="65" rx="8" fill="#27272a" stroke="#dc2626" stroke-width="2"/>
  <text x="125" y="112" font-family="system-ui" font-size="14" font-weight="800" fill="#f87171" text-anchor="middle">M — MILITARISM</text>
  <text x="125" y="132" font-family="system-ui" font-size="10" fill="#cbd5e1" text-anchor="middle">Anglo-German Naval Race</text>

  <rect x="215" y="85" width="150" height="65" rx="8" fill="#27272a" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="112" font-family="system-ui" font-size="14" font-weight="800" fill="#60a5fa" text-anchor="middle">A — ALLIANCES</text>
  <text x="290" y="132" font-family="system-ui" font-size="10" fill="#cbd5e1" text-anchor="middle">Triple Alliance vs Entente</text>

  <rect x="380" y="85" width="150" height="65" rx="8" fill="#27272a" stroke="#d97706" stroke-width="2"/>
  <text x="455" y="112" font-family="system-ui" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="middle">I — IMPERIALISM</text>
  <text x="455" y="132" font-family="system-ui" font-size="10" fill="#cbd5e1" text-anchor="middle">Scramble for Africa &amp; Asia</text>

  <rect x="545" y="85" width="155" height="65" rx="8" fill="#27272a" stroke="#16a34a" stroke-width="2"/>
  <text x="622" y="112" font-family="system-ui" font-size="14" font-weight="800" fill="#4ade80" text-anchor="middle">N — NATIONALISM</text>
  <text x="622" y="132" font-family="system-ui" font-size="10" fill="#cbd5e1" text-anchor="middle">Balkan Pan-Slavism Crisis</text>

  <!-- Horizontal Timeline Axis -->
  <line x1="60" y1="230" x2="690" y2="230" stroke="#71717a" stroke-width="4"/>

  <!-- Milestone 1: 1882 -->
  <circle cx="100" cy="230" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <text x="100" y="200" font-family="system-ui" font-size="13" font-weight="800" fill="#f87171" text-anchor="middle">1882</text>
  <text x="100" y="265" font-family="system-ui" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Triple Alliance</text>
  <text x="100" y="282" font-family="system-ui" font-size="10" fill="#a1a1aa" text-anchor="middle">Germany, Austria-Hungary,</text>
  <text x="100" y="296" font-family="system-ui" font-size="10" fill="#a1a1aa" text-anchor="middle">Italy signed defense pact</text>

  <!-- Milestone 2: 1907 -->
  <circle cx="280" cy="230" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <text x="280" y="200" font-family="system-ui" font-size="13" font-weight="800" fill="#60a5fa" text-anchor="middle">1907</text>
  <text x="280" y="265" font-family="system-ui" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Triple Entente</text>
  <text x="280" y="282" font-family="system-ui" font-size="10" fill="#a1a1aa" text-anchor="middle">Britain, France, Russia</text>
  <text x="280" y="296" font-family="system-ui" font-size="10" fill="#a1a1aa" text-anchor="middle">counterbalance alliance</text>

  <!-- Milestone 3: 28 June 1914 (Immediate Spark) -->
  <circle cx="480" cy="230" r="14" fill="#facc15" stroke="#ef4444" stroke-width="3"/>
  <text x="480" y="195" font-family="system-ui" font-size="13" font-weight="900" fill="#facc15" text-anchor="middle">28 JUNE 1914</text>
  <text x="480" y="265" font-family="system-ui" font-size="11" font-weight="800" fill="#ef4444" text-anchor="middle">Sarajevo Crisis*</text>
  <text x="480" y="282" font-family="system-ui" font-size="10" fill="#fecaca" text-anchor="middle">Archduke Franz Ferdinand</text>
  <text x="480" y="296" font-family="system-ui" font-size="10" fill="#fecaca" text-anchor="middle">assassinated by Princip</text>

  <!-- Milestone 4: 28 July 1914 -->
  <circle cx="650" cy="230" r="12" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <text x="650" y="200" font-family="system-ui" font-size="13" font-weight="800" fill="#f87171" text-anchor="middle">28 JULY 1914</text>
  <text x="650" y="265" font-family="system-ui" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Outbreak of War</text>
  <text x="650" y="282" font-family="system-ui" font-size="10" fill="#a1a1aa" text-anchor="middle">Austria invades Serbia;</text>
  <text x="650" y="296" font-family="system-ui" font-size="10" fill="#a1a1aa" text-anchor="middle">Alliances trigger domino</text>

  <!-- Footer Authenticity & Gatekeeping Notice -->
  <rect x="50" y="340" width="650" height="50" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="375" y="362" font-family="system-ui" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">ARCHIVAL PROVENANCE: Imperial War Museums &amp; National Archives Authenticated</text>
  <text x="375" y="378" font-family="system-ui" font-size="11" fill="#a1a1aa" text-anchor="middle">Strict Pedagogical Rule: Historical events strictly utilize 2D chronological timelines &amp; genuine photos (NO 3D models).</text>
</svg>

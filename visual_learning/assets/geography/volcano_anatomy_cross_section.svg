<svg viewBox="0 0 650 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="magmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="650" height="480" fill="url(#bgG)" rx="16"/>

  <text x="325" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">GEOGRAPHY: COMPOSITE VOLCANO ANATOMY</text>
  <text x="325" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">ICSE Class 9 Physical Geography: Internal Magma Dynamics vs Surface Lava Extrusion</text>

  <!-- Volcanic Mountain Cone (Stratified Layers) -->
  <polygon points="325,110 80,360 570,360" fill="#78350f" stroke="#92400e" stroke-width="2"/>
  <polygon points="325,110 140,360 510,360" fill="#854d0e" opacity="0.6"/>
  <polygon points="325,110 200,360 450,360" fill="#a16207" opacity="0.4"/>

  <!-- Ash and Gas Cloud Plume -->
  <ellipse cx="325" cy="85" rx="55" ry="25" fill="#64748b" opacity="0.75"/>
  <ellipse cx="355" cy="70" rx="40" ry="20" fill="#94a3b8" opacity="0.6"/>
  <text x="325" y="88" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Ash, Steam &amp; Gas Cloud</text>

  <!-- Summit Crater and Vent -->
  <ellipse cx="325" cy="115" rx="35" ry="14" fill="#292524" stroke="#ea580c" stroke-width="3"/>
  <text x="325" y="145" font-family="system-ui" font-size="12" font-weight="800" fill="#ea580c" text-anchor="middle">Crater Vent (Lava Egress)</text>

  <!-- Central Conduit / Main Pipe -->
  <rect x="313" y="125" width="24" height="235" fill="url(#magmaGrad)" stroke="#f97316" stroke-width="2"/>
  <text x="240" y="240" font-family="system-ui" font-size="12" font-weight="700" fill="#fef08a">Main Conduit</text>

  <!-- Magma Chamber (Subsurface reservoir) -->
  <ellipse cx="325" cy="410" rx="130" ry="45" fill="url(#magmaGrad)" stroke="#f97316" stroke-width="3"/>
  <text x="325" y="415" font-family="system-ui" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">MAGMA CHAMBER</text>
  <text x="325" y="435" font-family="system-ui" font-size="11" font-weight="700" fill="#fef08a" text-anchor="middle">Underground Molten Rock Under High Tectonic Pressure</text>

  <!-- Magma vs Lava Distinction Callout -->
  <rect x="50" y="325" width="180" height="30" rx="6" fill="#0f172a" stroke="#ea580c" stroke-width="1.5"/>
  <text x="140" y="345" font-family="system-ui" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">Underground: MAGMA</text>

  <rect x="420" y="165" width="180" height="30" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="510" y="185" font-family="system-ui" font-size="11" font-weight="700" fill="#fed7aa" text-anchor="middle">On Surface: LAVA</text>
</svg>

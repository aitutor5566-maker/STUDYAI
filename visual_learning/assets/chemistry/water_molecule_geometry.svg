<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="oGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <radialGradient id="hGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bgC)" rx="16"/>

  <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle">CHEMISTRY: WATER MOLECULE (H₂O) BENT GEOMETRY</text>
  <text x="300" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">VSEPR Theory: sp³ Hybridization, 2 Bonding Pairs, 2 Non-Bonding Lone Pairs</text>

  <!-- Lone Pair Lobes -->
  <ellipse cx="250" cy="115" rx="35" ry="50" fill="#facc15" opacity="0.35" transform="rotate(-30 250 115)"/>
  <ellipse cx="350" cy="115" rx="35" ry="50" fill="#facc15" opacity="0.35" transform="rotate(30 350 115)"/>
  <circle cx="240" cy="95" r="4" fill="#fef08a"/>
  <circle cx="255" cy="105" r="4" fill="#fef08a"/>
  <circle cx="345" cy="105" r="4" fill="#fef08a"/>
  <circle cx="360" cy="95" r="4" fill="#fef08a"/>
  <text x="300" y="85" font-family="system-ui" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle">2 Lone Electron Pairs (High Repulsion)</text>

  <!-- Covalent Bonds -->
  <line x1="260" y1="210" x2="190" y2="290" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <line x1="340" y1="210" x2="410" y2="290" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>

  <!-- Central Oxygen Atom -->
  <circle cx="300" cy="190" r="58" fill="url(#oGrad)" stroke="#fca5a5" stroke-width="3"/>
  <text x="300" y="195" font-family="system-ui" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">O</text>
  <text x="300" y="218" font-family="system-ui" font-size="12" font-weight="700" fill="#fee2e2" text-anchor="middle">(δ⁻ Partial Negative)</text>

  <!-- Hydrogen Atoms -->
  <circle cx="170" cy="310" r="38" fill="url(#hGrad)" stroke="#93c5fd" stroke-width="3"/>
  <text x="170" y="315" font-family="system-ui" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">H</text>
  <text x="170" y="335" font-family="system-ui" font-size="11" font-weight="700" fill="#dbeafe" text-anchor="middle">(δ⁺)</text>

  <circle cx="430" cy="310" r="38" fill="url(#hGrad)" stroke="#93c5fd" stroke-width="3"/>
  <text x="430" y="315" font-family="system-ui" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">H</text>
  <text x="430" y="335" font-family="system-ui" font-size="11" font-weight="700" fill="#dbeafe" text-anchor="middle">(δ⁺)</text>

  <!-- Bond Angle Arc -->
  <path d="M 230 240 A 60 60 0 0 0 370 240" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="5,3"/>
  <text x="300" y="275" font-family="system-ui" font-size="16" font-weight="900" fill="#facc15" text-anchor="middle">104.5°</text>

  <!-- Dipole Moment Vector -->
  <line x1="300" y1="380" x2="300" y2="400" stroke="#38bdf8" stroke-width="3"/>
  <text x="300" y="415" font-family="system-ui" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Net Dipole Moment (μ = 1.85 D) — Polar Solvent</text>
</svg>

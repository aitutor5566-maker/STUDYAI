        <text x="12" y="16" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">8</text>
        <text x="30" y="16" fill="#4ADE80" font-size="11" font-weight="800">Understanding-Check Question</text>
      </g>

      <!-- Understanding check interactive card -->

      <rect width="230" height="74" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="22" fill="#60A5FA" font-size="12" font-weight="800">Supportive Spelling Guidance</text>
      <text x="14" y="38" fill="#CBD5E1" font-size="10">Query: "fotosynthesis" / "respration"</text>
      <rect x="14" y="46" width="202" height="20" rx="5" fill="#1E3A8A"/>
      <text x="22" y="60" fill="#93C5FD" font-size="9" font-weight="700">Gentle: "photosynthesis" (No shaming!)</text>

      <!-- Step 2: Prerequisite Bridging -->
      <rect y="84" width="230" height="74" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="106" fill="#4ADE80" font-size="12" font-weight="800">Foundational Prerequisite Bridge</text>
      <text x="14" y="122" fill="#CBD5E1" font-size="10">Triggers on Maths/Physics weaknesses</text>
      <rect x="14" y="130" width="202" height="20" rx="5" fill="#14532D"/>
      <text x="22" y="144" fill="#86EFAC" font-size="9" font-weight="700">Bridges core foundations before formulas</text>

      <!-- Step 3: Writing & Structure Guide -->

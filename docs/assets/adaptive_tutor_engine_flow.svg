    <text y="7" fill="#F8FAFC" font-size="18" font-weight="800" letter-spacing="1">STUDYAI • ULTIMATE ADAPTIVE AI TUTOR ARCHITECTURE</text>
  </g>

  <!-- 1. Left Column: Student Weakness & Learning Profile Input -->
  <g transform="translate(40, 100)">

      <text x="77" y="40" fill="#E9D5FF" font-size="10" text-anchor="middle">Topic &amp; Subject Preserved</text>
      <rect x="12" y="48" width="131" height="40" rx="6" fill="rgba(0,0,0,0.3)"/>
      <text x="77" y="64" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">🚀 Space Battle</text>
      <text x="77" y="78" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">⚔️ Concept Duel • 🏃 Runner</text>

      <!-- 40-Mark Mock Test -->

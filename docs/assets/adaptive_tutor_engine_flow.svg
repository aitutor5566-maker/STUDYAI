      <text x="12" y="306" fill="#4ADE80" font-size="11" font-weight="800">INTERACTIVE SELF-TEST</text>
      <rect x="12" y="316" width="186" height="22" rx="5" fill="#1E293B" stroke="#334155"/>
      <text x="20" y="331" fill="#E2E8F0" font-size="9">Option A: Correct mechanism</text>
      <rect x="12" y="342" width="186" height="22" rx="5" fill="#1E293B" stroke="#334155"/>
      <text x="20" y="357" fill="#E2E8F0" font-size="9">Option B: Plausible distractor</text>
      
      <rect x="12" y="372" width="186" height="50" rx="6" fill="#14532D" stroke="#22C55E"/>
      <text x="20" y="390" fill="#86EFAC" font-size="10" font-weight="800">Instant Real-Time Evaluation:</text>
      <text x="20" y="404" fill="#DCFCE7" font-size="9">• Correct: +100 score &amp; positive reinforcement</text>
      <text x="20" y="416" fill="#DCFCE7" font-size="9">• Incorrect: Gentle non-shaming clarification</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -->
  <path d="M 930 370 L 965 370" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- 4. Fourth Column: Action & Feedback Loop -->

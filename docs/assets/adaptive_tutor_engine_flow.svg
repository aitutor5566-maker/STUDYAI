      <text x="14" y="406" fill="#94A3B8" font-size="10">• Parabola SVG interactive solvers</text>
      <text x="14" y="422" fill="#94A3B8" font-size="10">• Natural speech voice narration</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -->

      <rect x="14" y="214" width="202" height="20" rx="5" fill="#78350F"/>
      <text x="22" y="228" fill="#FDE68A" font-size="9" font-weight="700">Sentence starters: "First...", "Therefore..."</text>

      <!-- Step 4: Memory Hooks & Mnemonics -->
      <rect y="252" width="230" height="74" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="274" fill="#C084FC" font-size="12" font-weight="800">Memory Hooks &amp; Mnemonics</text>

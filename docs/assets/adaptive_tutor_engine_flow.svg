      <text x="12" y="132" fill="#38BDF8" font-size="11" font-weight="800">📝 40-Mark Mock Test</text>
      <text x="12" y="148" fill="#94A3B8" font-size="9">Timed exam practice with</text>
      <text x="12" y="160" fill="#94A3B8" font-size="9">Options 1, 2 &amp; 3 structures</text>
      <text x="12" y="174" fill="#38BDF8" font-size="9" font-weight="700">Strict 40-mark validation</text>

      <!-- Dynamic Feedback Rating -->
      <rect y="198" width="155" height="110" rx="10" fill="#0F172A" stroke="#E2E8F0"/>
      <text x="12" y="218" fill="#F8FAFC" font-size="11" font-weight="800">Dynamic Feedback</text>
      <text x="12" y="232" fill="#94A3B8" font-size="9">Adapts future tone &amp; depth</text>
      <rect x="12" y="240" width="131" height="18" rx="4" fill="#334155"/>
      <text x="77" y="253" fill="#FEF08A" font-size="9" font-weight="700" text-anchor="middle">🟡 Too Simple</text>
      <rect x="12" y="262" width="131" height="18" rx="4" fill="#14532D"/>
      <text x="77" y="275" fill="#86EFAC" font-size="9" font-weight="700" text-anchor="middle">🟢 Just Right</text>
      <rect x="12" y="284" width="131" height="18" rx="4" fill="#334155"/>
      <text x="77" y="297" fill="#BAE6FD" font-size="9" font-weight="700" text-anchor="middle">🔵 Too Detailed</text>

      <!-- Progress Tracking -->
      <rect y="320" width="155" height="120" rx="10" fill="#0F172A" stroke="rgba(74,222,128,0.3)"/>
      <text x="12" y="340" fill="#4ADE80" font-size="11" font-weight="800">Mastery Progression</text>
      <text x="12" y="356" fill="#94A3B8" font-size="9">No permanent negative tags</text>
      <rect x="12" y="366" width="131" height="8" rx="4" fill="#1E293B"/>
      <rect x="12" y="366" width="112" height="8" rx="4" fill="#22C55E"/>
      <text x="12" y="390" fill="#CBD5E1" font-size="9">• Learning: 0-60%</text>
      <text x="12" y="404" fill="#CBD5E1" font-size="9">• Practicing: 61-84%</text>
      <text x="12" y="418" fill="#4ADE80" font-size="9" font-weight="700">• Mastered: 85-100%</text>
    </g>

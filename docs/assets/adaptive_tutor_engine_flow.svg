    <text x="125" y="42" fill="#FFFFFF" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">1. STUDENT LEARNING PROFILE</text>

    <!-- Weakness Categories -->
    <g transform="translate(20, 75)">
      <!-- Item 1 -->
      <rect width="210" height="48" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="20" fill="#E2E8F0" font-size="12" font-weight="700">📖 Reading Difficulties</text>
      <text x="14" y="36" fill="#94A3B8" font-size="10">Auto-chunks text, simpler sentences</text>

      <!-- Item 2 -->
      <rect y="56" width="210" height="48" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="76" fill="#E2E8F0" font-size="12" font-weight="700">✍️ Spelling &amp; Vocabulary</text>
      <text x="14" y="92" fill="#94A3B8" font-size="10">Gentle spelling notes, clear glossaries</text>

      <!-- Item 3 -->
      <rect y="112" width="210" height="48" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="132" fill="#E2E8F0" font-size="12" font-weight="700">🎯 Difficult Subjects &amp; Topics</text>
      <text x="14" y="148" fill="#94A3B8" font-size="10">Auto-triggers prerequisite bridge</text>

      <!-- Item 4 -->
      <rect y="168" width="210" height="48" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="188" fill="#E2E8F0" font-size="12" font-weight="700">🧠 Concept &amp; Memory</text>
      <text x="14" y="204" fill="#94A3B8" font-size="10">Visual 3D first &amp; mnemonic hooks</text>

      <!-- Item 5 -->
      <rect y="224" width="210" height="48" rx="10" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="244" fill="#E2E8F0" font-size="12" font-weight="700">📐 Math Calculations</text>
      <text x="14" y="260" fill="#94A3B8" font-size="10">Interactive SVG parabolic plots</text>

      <!-- Depth Selector Badge -->

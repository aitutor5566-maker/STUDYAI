  <circle cx="200" cy="100" r="150" fill="#7C3AED" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="180" fill="#0284C7" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="220" fill="#FF6A00" opacity="0.05" filter="url(#glow)"/>

  <!-- Top Title Banner -->
  <g transform="translate(600, 48)" text-anchor="middle">

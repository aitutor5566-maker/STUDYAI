        <text x="12" y="16" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">1</text>
        <text x="30" y="16" fill="#E2E8F0" font-size="11" font-weight="700">Topic Title &amp; Subject Badge</text>
      </g>
      <g transform="translate(0, 36)">
        <circle cx="12" cy="12" r="10" fill="#0284C7"/>
        <text x="12" y="16" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">2</text>
        <text x="30" y="16" fill="#E2E8F0" font-size="11" font-weight="700">Simple Everyday Definition</text>
      </g>
      <g transform="translate(0, 72)">
        <circle cx="12" cy="12" r="10" fill="#0284C7"/>
        <text x="12" y="16" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">3</text>
        <text x="30" y="16" fill="#E2E8F0" font-size="11" font-weight="700">How / Why It Works (Steps)</text>
      </g>
      <g transform="translate(0, 108)">
        <circle cx="12" cy="12" r="10" fill="#0284C7"/>
        <text x="12" y="16" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">4</text>
        <text x="30" y="16" fill="#E2E8F0" font-size="11" font-weight="700">Integrated Image or 3D Model</text>
      </g>
      <g transform="translate(0, 144)">
        <circle cx="12" cy="12" r="10" fill="#0284C7"/>
        <text x="12" y="16" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">5</text>
        <text x="30" y="16" fill="#E2E8F0" font-size="11" font-weight="700">Important Terms &amp; Definitions</text>
      </g>
      <g transform="translate(0, 180)">
        <circle cx="12" cy="12" r="10" fill="#0284C7"/>
        <text x="12" y="16" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">6</text>
        <text x="30" y="16" fill="#E2E8F0" font-size="11" font-weight="700">Meaningful Practical Example</text>
      </g>
      <g transform="translate(0, 216)">
        <circle cx="12" cy="12" r="10" fill="#0284C7"/>
        <text x="12" y="16" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">7</text>
        <text x="30" y="16" fill="#E2E8F0" font-size="11" font-weight="700">Short Summary &amp; Takeaways</text>
      </g>
      <g transform="translate(0, 252)">

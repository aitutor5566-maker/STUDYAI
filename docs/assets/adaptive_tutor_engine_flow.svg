      <text x="14" y="304" fill="#FF8C38" font-size="11" font-weight="800">EXPLANATION DEPTH CONTROLS</text>
      <rect x="14" y="314" width="56" height="24" rx="6" fill="#FF6A00"/>
      <text x="42" y="330" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">Concise</text>
      <rect x="76" y="314" width="56" height="24" rx="6" fill="#334155"/>
      <text x="104" y="330" fill="#CBD5E1" font-size="10" font-weight="700" text-anchor="middle">Balanced</text>
      <rect x="138" y="314" width="58" height="24" rx="6" fill="#334155"/>
      <text x="167" y="330" fill="#CBD5E1" font-size="10" font-weight="700" text-anchor="middle">Detailed</text>
      <text x="14" y="354" fill="#94A3B8" font-size="9">Preserves 100% scientific meaning</text>

      <!-- Persistence pill -->
      <rect y="376" width="210" height="50" rx="10" fill="#0F172A" stroke="rgba(56,189,248,0.3)"/>
      <text x="14" y="396" fill="#38BDF8" font-size="11" font-weight="800">DATABASE SYNC &amp; RLS</text>
      <text x="14" y="412" fill="#94A3B8" font-size="10">SQLite + Supabase 009 Migration</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -->

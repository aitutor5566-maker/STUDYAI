      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="cardGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">

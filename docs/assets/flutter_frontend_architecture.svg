<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="flutterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B"/>
      <stop offset="50%" stop-color="#0175C2"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="flutterOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#E85D00"/>
    </linearGradient>
    <linearGradient id="darkTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="fShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Badge -->
  <rect x="230" y="20" width="540" height="48" rx="24" fill="url(#flutterGrad)" filter="url(#fShadow)"/>
  <text x="500" y="51" fill="#FFFFFF" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="1">FLUTTER &amp; DART FRONTEND ARCHITECTURE</text>

  <!-- Central Flutter Core Engine Hub -->
  <g transform="translate(320, 95)">
    <rect x="0" y="0" width="360" height="110" rx="18" fill="url(#darkTile)" stroke="#38BDF8" stroke-width="2" filter="url(#fShadow)"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#0175C2" fill-opacity="0.3"/>
    <text x="40" y="47" fill="#38BDF8" font-size="22" font-weight="bold" text-anchor="middle">🎯</text>
    <text x="75" y="42" fill="#FFFFFF" font-size="17" font-weight="800">Flutter 3.24+ &amp; Dart 3.5+</text>
    <text x="75" y="62" fill="#94A3B8" font-size="12">Cross-Platform Impeller / Skia 60fps Hardware Pipeline</text>
    <g transform="translate(20, 78)">
      <rect x="0" y="0" width="95" height="20" rx="6" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="47" y="14" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">Single Codebase</text>
      <rect x="105" y="0" width="95" height="20" rx="6" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="152" y="14" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">Declarative UI</text>
      <rect x="210" y="0" width="105" height="20" rx="6" fill="#38BDF8" fill-opacity="0.2"/>
      <text x="262" y="14" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">Apple Glass Cards</text>
    </g>
  </g>

  <!-- Connectors downwards to 3 Apps -->
  <path d="M 500 205 L 500 240 L 170 240 L 170 260" fill="none" stroke="#38BDF8" stroke-width="2"/>
  <path d="M 500 205 L 500 260" fill="none" stroke="#FF6A00" stroke-width="2"/>
  <path d="M 500 205 L 500 240 L 830 240 L 830 260" fill="none" stroke="#A855F7" stroke-width="2"/>

  <!-- Row 2: Three Flutter Applications -->
  <!-- App 1: Student App -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="280" height="120" rx="16" fill="url(#darkTile)" stroke="#38BDF8" stroke-width="1.5" filter="url(#fShadow)"/>
    <text x="20" y="32" fill="#38BDF8" font-size="15" font-weight="800">📱 apps/student_app/</text>
    <text x="20" y="52" fill="#FFFFFF" font-size="12" font-weight="600">Student Multi-Platform App</text>
    <text x="20" y="72" fill="#CBD5E1" font-size="11">• Android (APK/AAB), iOS (IPA)</text>
    <text x="20" y="90" fill="#CBD5E1" font-size="11">• Web PWA (Wasm / CanvasKit)</text>
    <text x="20" y="108" fill="#94A3B8" font-size="10">Target: studyai.com</text>
  </g>

  <!-- App 2: Admin Portal -->
  <g transform="translate(360, 260)">
    <rect x="0" y="0" width="280" height="120" rx="16" fill="url(#darkTile)" stroke="#FF6A00" stroke-width="1.5" filter="url(#fShadow)"/>
    <text x="20" y="32" fill="#FF6A00" font-size="15" font-weight="800">🛡️ apps/admin_portal/</text>
    <text x="20" y="52" fill="#FFFFFF" font-size="12" font-weight="600">Admin Web Dashboard</text>
    <text x="20" y="72" fill="#CBD5E1" font-size="11">• Curriculum &amp; Student Manager</text>
    <text x="20" y="90" fill="#CBD5E1" font-size="11">• 40-Mark Exam Authoring Suite</text>
    <text x="20" y="108" fill="#94A3B8" font-size="10">Target: admin.studyai.com</text>
  </g>

  <!-- App 3: Super Admin Portal -->
  <g transform="translate(690, 260)">
    <rect x="0" y="0" width="280" height="120" rx="16" fill="url(#darkTile)" stroke="#A855F7" stroke-width="1.5" filter="url(#fShadow)"/>
    <text x="20" y="32" fill="#A855F7" font-size="15" font-weight="800">⚡ apps/superadmin_portal/</text>
    <text x="20" y="52" fill="#FFFFFF" font-size="12" font-weight="600">Isolated Super Admin Web</text>
    <text x="20" y="72" fill="#CBD5E1" font-size="11">• AI Provider Health &amp; Cost Meter</text>
    <text x="20" y="90" fill="#CBD5E1" font-size="11">• Global Role &amp; Tenant Governance</text>
    <text x="20" y="108" fill="#94A3B8" font-size="10">Target: superadmin.studyai.com</text>
  </g>

  <!-- Row 3: Shared Flutter Packages Tier -->
  <g transform="translate(30, 405)">
    <rect x="0" y="0" width="940" height="95" rx="16" fill="url(#darkTile)" stroke="#10B981" stroke-width="1.5" filter="url(#fShadow)"/>
    <text x="24" y="28" fill="#10B981" font-size="14" font-weight="800">📦 SHARED FLUTTER / DART PACKAGES (packages/)</text>

    <!-- Package 1: shared_ui -->
    <g transform="translate(24, 40)">
      <rect x="0" y="0" width="205" height="42" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="12" y="20" fill="#FFFFFF" font-size="12" font-weight="700">packages/shared_ui</text>
      <text x="12" y="34" fill="#94A3B8" font-size="10">GlassCard, GlassPill, Theme</text>
    </g>

    <!-- Package 2: shared_services -->
    <g transform="translate(245, 40)">
      <rect x="0" y="0" width="215" height="42" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="12" y="20" fill="#FFFFFF" font-size="12" font-weight="700">packages/shared_services</text>
      <text x="12" y="34" fill="#94A3B8" font-size="10">ApiClient, AuthService, Cache</text>
    </g>

    <!-- Package 3: shared_models -->
    <g transform="translate(475, 40)">
      <rect x="0" y="0" width="215" height="42" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="12" y="20" fill="#FFFFFF" font-size="12" font-weight="700">packages/shared_models</text>
      <text x="12" y="34" fill="#94A3B8" font-size="10">Lesson, Exam, User, Game</text>
    </g>

    <!-- Package 4: flutter_studyai_visual -->
    <g transform="translate(705, 40)">
      <rect x="0" y="0" width="210" height="42" rx="10" fill="#1E293B" stroke="#334155"/>
      <text x="12" y="20" fill="#FFFFFF" font-size="12" font-weight="700">flutter_studyai_visual</text>
      <text x="12" y="34" fill="#94A3B8" font-size="10">Three.js WebGL 3D Bridge</text>
    </g>
  </g>
</svg>

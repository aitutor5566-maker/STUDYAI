<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#E85D00"/>
    </linearGradient>
    <linearGradient id="journeyCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadowGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF6A00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Banner -->
  <rect x="250" y="20" width="500" height="44" rx="22" fill="url(#stepGrad)"/>
  <text x="500" y="48" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">ONE TOPIC → ONE COMPLETE LEARNING JOURNEY</text>

  <!-- Step 1 -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="120" height="150" rx="14" fill="url(#journeyCard)" stroke="#FF6A00" stroke-width="2"/>
    <circle cx="60" cy="35" r="20" fill="#FF6A00" fill-opacity="0.2"/>
    <text x="60" y="42" fill="#FF6A00" font-size="18" font-weight="bold" text-anchor="middle">1</text>
    <text x="60" y="75" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Pick Topic</text>
    <text x="60" y="95" fill="#94A3B8" font-size="10" text-anchor="middle">Human Heart</text>
    <text x="60" y="110" fill="#94A3B8" font-size="10" text-anchor="middle">DNA • Atoms</text>
    <text x="60" y="125" fill="#94A3B8" font-size="10" text-anchor="middle">Circuits • Solar</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 155 170 L 175 170" fill="none" stroke="#FF6A00" stroke-width="3"/>

  <!-- Step 2 -->
  <g transform="translate(180, 95)">
    <rect x="0" y="0" width="125" height="150" rx="14" fill="url(#journeyCard)" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="62" cy="35" r="20" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="62" y="42" fill="#38BDF8" font-size="18" font-weight="bold" text-anchor="middle">2</text>
    <text x="62" y="75" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">AI Tutor Mode A</text>
    <text x="62" y="95" fill="#94A3B8" font-size="10" text-anchor="middle">Socratic Mastery</text>
    <text x="62" y="110" fill="#94A3B8" font-size="10" text-anchor="middle">7-Part Explanations</text>
    <text x="62" y="125" fill="#94A3B8" font-size="10" text-anchor="middle">Zero Hallucination</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 310 170 L 330 170" fill="none" stroke="#38BDF8" stroke-width="3"/>

  <!-- Step 3 -->
  <g transform="translate(335, 95)">
    <rect x="0" y="0" width="125" height="150" rx="14" fill="url(#journeyCard)" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="62" cy="35" r="20" fill="#EC4899" fill-opacity="0.2"/>
    <text x="62" y="42" fill="#EC4899" font-size="18" font-weight="bold" text-anchor="middle">3</text>
    <text x="62" y="75" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">3D Visual Lab</text>
    <text x="62" y="95" fill="#94A3B8" font-size="10" text-anchor="middle">Three.js 60fps</text>
    <text x="62" y="110" fill="#94A3B8" font-size="10" text-anchor="middle">360° Orbit &amp; Slices</text>
    <text x="62" y="125" fill="#94A3B8" font-size="10" text-anchor="middle">Anatomy &amp; Physics</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 465 170 L 485 170" fill="none" stroke="#EC4899" stroke-width="3"/>

  <!-- Step 4 -->
  <g transform="translate(490, 95)">
    <rect x="0" y="0" width="125" height="150" rx="14" fill="url(#journeyCard)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="62" cy="35" r="20" fill="#10B981" fill-opacity="0.2"/>
    <text x="62" y="42" fill="#10B981" font-size="18" font-weight="bold" text-anchor="middle">4</text>
    <text x="62" y="75" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">AI Smart Notes</text>
    <text x="62" y="95" fill="#94A3B8" font-size="10" text-anchor="middle">Auto-Summaries</text>
    <text x="62" y="110" fill="#94A3B8" font-size="10" text-anchor="middle">Formula Cards</text>
    <text x="62" y="125" fill="#94A3B8" font-size="10" text-anchor="middle">PDF &amp; Text Export</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 620 170 L 640 170" fill="none" stroke="#10B981" stroke-width="3"/>

  <!-- Step 5 -->
  <g transform="translate(645, 95)">
    <rect x="0" y="0" width="135" height="150" rx="14" fill="url(#journeyCard)" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="67" cy="35" r="20" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="67" y="42" fill="#F59E0B" font-size="18" font-weight="bold" text-anchor="middle">5</text>
    <text x="67" y="75" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Adaptive Games</text>
    <text x="67" y="95" fill="#94A3B8" font-size="10" text-anchor="middle">Fighting Game</text>
    <text x="67" y="110" fill="#94A3B8" font-size="10" text-anchor="middle">Shooting Game</text>
    <text x="67" y="125" fill="#94A3B8" font-size="10" text-anchor="middle">Preference Play</text>
  </g>

  <!-- Arrow 5-6 -->
  <path d="M 785 170 L 805 170" fill="none" stroke="#F59E0B" stroke-width="3"/>

  <!-- Step 6 -->
  <g transform="translate(810, 95)">
    <rect x="0" y="0" width="155" height="150" rx="14" fill="url(#journeyCard)" stroke="#A855F7" stroke-width="2"/>
    <circle cx="77" cy="35" r="20" fill="#A855F7" fill-opacity="0.2"/>
    <text x="77" y="42" fill="#A855F7" font-size="18" font-weight="bold" text-anchor="middle">6</text>
    <text x="77" y="75" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">40-Mark Exam</text>
    <text x="77" y="95" fill="#94A3B8" font-size="10" text-anchor="middle">Option A / B / C</text>
    <text x="77" y="110" fill="#94A3B8" font-size="10" text-anchor="middle">Strict 40-Mark Sum</text>
    <text x="77" y="125" fill="#94A3B8" font-size="10" text-anchor="middle">Auto-Grading &amp; Review</text>
  </g>

  <!-- Feedback / Mastery Loop Bottom Bar -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="935" height="160" rx="16" fill="url(#journeyCard)" stroke="#FF6A00" stroke-width="1.5"/>
    
    <!-- Outcome 1: Points & Badges -->
    <rect x="30" y="25" width="260" height="110" rx="12" fill="#FF6A00" fill-opacity="0.1"/>
    <text x="50" y="55" fill="#FF6A00" font-size="16" font-weight="700">🏆 Points &amp; Achievements</text>
    <text x="50" y="80" fill="#CBD5E1" font-size="12">• Backend XP Validation</text>
    <text x="50" y="100" fill="#CBD5E1" font-size="12">• Streak Multipliers &amp; Badges</text>
    <text x="50" y="120" fill="#94A3B8" font-size="11">Reward genuine learning milestones</text>

    <!-- Outcome 2: Mode B Exam Prep -->
    <rect x="335" y="25" width="265" height="110" rx="12" fill="#38BDF8" fill-opacity="0.1"/>
    <text x="355" y="55" fill="#38BDF8" font-size="16" font-weight="700">⚡ AI Tutor Mode B</text>
    <text x="355" y="80" fill="#CBD5E1" font-size="12">• Targeted Error Remediation</text>
    <text x="355" y="100" fill="#CBD5E1" font-size="12">• Timed Rapid Question Drill</text>
    <text x="355" y="120" fill="#94A3B8" font-size="11">Focus on weak syllabus areas</text>

    <!-- Outcome 3: Parent Dashboard -->
    <rect x="645" y="25" width="260" height="110" rx="12" fill="#10B981" fill-opacity="0.1"/>
    <text x="665" y="55" fill="#10B981" font-size="16" font-weight="700">👨‍👩‍👧 Parent Dashboard</text>
    <text x="665" y="80" fill="#CBD5E1" font-size="12">• Passcode Auth (2468)</text>
    <text x="665" y="100" fill="#CBD5E1" font-size="12">• Real-time Weekly Progress</text>
    <text x="665" y="120" fill="#94A3B8" font-size="11">Zero video distractors, 100% safe</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="engBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" fill="url(#engBg)" rx="28"/>

  <!-- Glowing Accent Orbs -->
  <circle cx="150" cy="120" r="140" fill="#FF6A00" opacity="0.12" filter="blur(40px)"/>
  <circle cx="1050" cy="150" r="160" fill="#0284C7" opacity="0.12" filter="blur(40px)"/>
  <circle cx="600" cy="620" r="180" fill="#10B981" opacity="0.10" filter="blur(50px)"/>

  <!-- Top Header Navigation Bar -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="74" rx="20" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 106, 0, 0.3)" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">
      🗣️ STUDYAI — Speak English &amp; Pronunciation Coaching Studio
    </text>
    <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">
      Real-Time Phonetic Analysis • 8 Real-World Conversation Scenarios • Native Accent Modeling • Instant Fluency Scoring
    </text>
    <g transform="translate(860, 20)">
      <rect width="188" height="34" rx="17" fill="url(#orangeGrad)"/>
      <text x="94" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">
        LIVE AI COACH ACTIVE 🎙️
      </text>
    </g>
  </g>

  <!-- Left Column: Real-Time Pronunciation & Phonetic Breakdown (Width: 350) -->
  <g transform="translate(60, 134)">
    <rect width="345" height="526" rx="22" fill="url(#cardGradDark)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <!-- Card Header -->
    <path d="M 0 22 Q 0 0 22 0 L 323 0 Q 345 0 345 22 L 345 54 L 0 54 Z" fill="rgba(255, 106, 0, 0.15)"/>
    <text x="24" y="34" font-family="sans-serif" font-size="15" font-weight="800" fill="#FF8533">
      1. Acoustic Phonetics &amp; Waveform
    </text>

    <!-- Target Phrase -->
    <g transform="translate(20, 68)">
      <rect width="305" height="70" rx="14" fill="#0B0F19" stroke="#334155"/>
      <text x="16" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#94A3B8">PRACTICE SENTENCE:</text>
      <text x="16" y="48" font-family="sans-serif" font-size="14" font-weight="800" fill="#F8FAFC">
        "I'd like to schedule an appointment."
      </text>
    </g>

    <!-- Color-Coded Phonetic Breakdown -->
    <g transform="translate(20, 150)">
      <text x="4" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">IPA Phoneme Accuracy:</text>
      <g transform="translate(0, 26)">
        <rect width="68" height="38" rx="8" fill="#064E3B" stroke="#10B981"/>
        <text x="34" y="20" font-family="monospace" font-size="12" font-weight="800" fill="#34D399" text-anchor="middle">/aɪd/</text>
        <text x="34" y="32" font-family="sans-serif" font-size="9" fill="#A7F3D0" text-anchor="middle">98%</text>
      </g>
      <g transform="translate(74, 26)">
        <rect width="68" height="38" rx="8" fill="#064E3B" stroke="#10B981"/>
        <text x="34" y="20" font-family="monospace" font-size="12" font-weight="800" fill="#34D399" text-anchor="middle">/laɪk/</text>
        <text x="34" y="32" font-family="sans-serif" font-size="9" fill="#A7F3D0" text-anchor="middle">96%</text>
      </g>
      <g transform="translate(148, 26)">
        <rect width="84" height="38" rx="8" fill="#451A03" stroke="#F59E0B"/>
        <text x="42" y="20" font-family="monospace" font-size="12" font-weight="800" fill="#FBBF24" text-anchor="middle">/ˈskedʒ.uːl/</text>
        <text x="42" y="32" font-family="sans-serif" font-size="9" fill="#FDE68A" text-anchor="middle">78% (Stress)</text>
      </g>
      <g transform="translate(238, 26)">
        <rect width="67" height="38" rx="8" fill="#064E3B" stroke="#10B981"/>
        <text x="33" y="20" font-family="monospace" font-size="12" font-weight="800" fill="#34D399" text-anchor="middle">/ən/</text>
        <text x="33" y="32" font-family="sans-serif" font-size="9" fill="#A7F3D0" text-anchor="middle">94%</text>
      </g>
    </g>

    <!-- Waveform Visualizer -->
    <g transform="translate(20, 230)">
      <rect width="305" height="84" rx="14" fill="#0B0F19" stroke="#1E293B"/>
      <text x="14" y="20" font-family="sans-serif" font-size="10" font-weight="800" fill="#38BDF8">PITCH &amp; ENERGY CONTOUR (AUDIO WAVE)</text>
      <!-- Simulated Pitch Curves -->
      <path d="M 20 54 Q 60 25 100 50 T 180 35 T 250 60 T 290 40" fill="none" stroke="#FF6A00" stroke-width="2.5"/>
      <path d="M 20 54 Q 60 30 100 48 T 180 40 T 250 55 T 290 45" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="3,3"/>
      <text x="14" y="74" font-family="sans-serif" font-size="9" fill="#94A3B8">
        Orange: Student Voice • Blue Dotted: Native Target Model
      </text>
    </g>

    <!-- 3-Metric Score Breakdown -->
    <g transform="translate(20, 330)">
      <text x="4" y="16" font-family="sans-serif" font-size="12" font-weight="800" fill="#E2E8F0">Comprehensive Fluency Metrics:</text>
      
      <!-- Metric 1: Pronunciation -->
      <g transform="translate(0, 26)">
        <rect width="305" height="42" rx="10" fill="#1E293B"/>
        <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Pronunciation Accuracy</text>
        <text x="290" y="18" font-family="sans-serif" font-size="12" font-weight="900" fill="#10B981" text-anchor="end">92%</text>
        <rect x="12" y="26" width="280" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="26" width="257" height="6" rx="3" fill="#10B981"/>
      </g>

      <!-- Metric 2: Rhythm & Intonation -->
      <g transform="translate(0, 76)">
        <rect width="305" height="42" rx="10" fill="#1E293B"/>
        <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Rhythm &amp; Natural Stress</text>
        <text x="290" y="18" font-family="sans-serif" font-size="12" font-weight="900" fill="#F59E0B" text-anchor="end">85%</text>
        <rect x="12" y="26" width="280" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="26" width="238" height="6" rx="3" fill="#F59E0B"/>
      </g>

      <!-- Metric 3: Fluency Pace -->
      <g transform="translate(0, 126)">
        <rect width="305" height="42" rx="10" fill="#1E293B"/>
        <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Speaking Pace (134 WPM)</text>
        <text x="290" y="18" font-family="sans-serif" font-size="12" font-weight="900" fill="#38BDF8" text-anchor="end">Optimal</text>
        <rect x="12" y="26" width="280" height="6" rx="3" fill="#334155"/>
        <rect x="12" y="26" width="270" height="6" rx="3" fill="#38BDF8"/>
      </g>
    </g>
  </g>

  <!-- Middle Column: Live AI Conversation Scenarios (Width: 380) -->
  <g transform="translate(425, 134)">
    <rect width="380" height="526" rx="22" fill="url(#cardGradDark)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <!-- Card Header -->
    <path d="M 0 22 Q 0 0 22 0 L 358 0 Q 380 0 380 22 L 380 54 L 0 54 Z" fill="rgba(2, 132, 199, 0.15)"/>
    <text x="24" y="34" font-family="sans-serif" font-size="15" font-weight="800" fill="#38BDF8">
      2. Dynamic Conversation Dialogue (8 Scenarios)
    </text>

    <!-- Scenario Badge -->
    <g transform="translate(20, 68)">
      <rect width="340" height="34" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
      <text x="12" y="22" font-family="sans-serif" font-size="12" font-weight="800" fill="#BAE6FD">
        💼 Active Scenario: Technical Job Interview Simulation
      </text>
    </g>

    <!-- Chat Dialogue Turn 1 (AI Tutor) -->
    <g transform="translate(20, 114)">
      <rect width="310" height="76" rx="14" fill="#1E293B" stroke="#334155"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#38BDF8">🤖 AI Coach Nova:</text>
      <text x="14" y="44" font-family="sans-serif" font-size="12" font-weight="500" fill="#F8FAFC">
        "Welcome! Could you describe a challenging project
      </text>
      <text x="14" y="62" font-family="sans-serif" font-size="12" font-weight="500" fill="#F8FAFC">
        you led and how you resolved team conflicts?"
      </text>
    </g>

    <!-- Chat Dialogue Turn 2 (Student Audio Answer) -->
    <g transform="translate(50, 202)">
      <rect width="310" height="88" rx="14" fill="#374151" stroke="#FF6A00"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#FF8533">🧑 Student Response (Recorded):</text>
      <text x="14" y="44" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">
        "I organized weekly syncs and focused on
      </text>
      <text x="14" y="62" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">
        active listening so everyone felt valued."
      </text>
      <g transform="translate(14, 68)">
        <text x="0" y="12" font-family="sans-serif" font-size="10" font-weight="700" fill="#4ADE80">✓ Clear tone • Natural connector words</text>
      </g>
    </g>

    <!-- Real-Time AI Feedback Box -->
    <g transform="translate(20, 304)">
      <rect width="340" height="110" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#A7F3D0">
        💡 Real-Time Polishing &amp; Vocabulary Upgrade:
      </text>
      <text x="14" y="44" font-family="sans-serif" font-size="11" font-weight="500" fill="#ECFDF5">
        • Try saying: <tspan font-weight="800" fill="#FBBF24">"facilitated constructive consensus"</tspan>
      </text>
      <text x="14" y="64" font-family="sans-serif" font-size="11" font-weight="500" fill="#ECFDF5">
        • Grammar: <tspan font-weight="700" fill="#34D399">100% Correct syntax</tspan>
      </text>
      <text x="14" y="84" font-family="sans-serif" font-size="11" font-weight="500" fill="#ECFDF5">
        • Fluency Boost: Strong confidence and pauses.
      </text>
    </g>

    <!-- Scenario Switcher Grid -->
    <g transform="translate(20, 426)">
      <text x="4" y="16" font-family="sans-serif" font-size="12" font-weight="800" fill="#E2E8F0">Explore 8 Immersive Situations:</text>
      <g transform="translate(0, 24)">
        <rect width="165" height="30" rx="8" fill="#1E293B" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">☕ Coffee Shop Order</text>
      </g>
      <g transform="translate(175, 24)">
        <rect width="165" height="30" rx="8" fill="#1E293B" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">✈️ Airport Check-in</text>
      </g>
      <g transform="translate(0, 60)">
        <rect width="165" height="30" rx="8" fill="#1E293B" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">🩺 Doctor Consultation</text>
      </g>
      <g transform="translate(175, 60)">
        <rect width="165" height="30" rx="8" fill="#1E293B" stroke="#334155"/>
        <text x="12" y="19" font-family="sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">🎓 University Seminar</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Phonics, Minimal Pairs & Interactive Games (Width: 315) -->
  <g transform="translate(825, 134)">
    <rect width="315" height="526" rx="22" fill="url(#cardGradDark)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <!-- Card Header -->
    <path d="M 0 22 Q 0 0 22 0 L 293 0 Q 315 0 315 22 L 315 54 L 0 54 Z" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="24" y="34" font-family="sans-serif" font-size="15" font-weight="800" fill="#34D399">
      3. Phonics &amp; Speaking Games
    </text>

    <!-- Minimal Pairs Drill -->
    <g transform="translate(20, 68)">
      <text x="4" y="14" font-family="sans-serif" font-size="12" font-weight="800" fill="#E2E8F0">Minimal Pairs Accent Drills:</text>
      
      <g transform="translate(0, 24)">
        <rect width="275" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
        <text x="14" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#F8FAFC">
          Ship <tspan fill="#64748B">/ʃɪp/</tspan> vs Sheep <tspan fill="#64748B">/ʃiːp/</tspan>
        </text>
        <text x="14" y="42" font-family="sans-serif" font-size="10" font-weight="600" fill="#38BDF8">
          Short lax [ɪ] vs Long tense [iː] tongue elevation
        </text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="275" height="52" rx="10" fill="#1E293B" stroke="#334155"/>
        <text x="14" y="24" font-family="sans-serif" font-size="13" font-weight="800" fill="#F8FAFC">
          Fan <tspan fill="#64748B">/fæn/</tspan> vs Van <tspan fill="#64748B">/væn/</tspan>
        </text>
        <text x="14" y="42" font-family="sans-serif" font-size="10" font-weight="600" fill="#10B981">
          Voiceless labiodental vs Voiced vocal fold vibration
        </text>
      </g>
    </g>

    <!-- All 7 Interactive Language Games -->
    <g transform="translate(20, 224)">
      <text x="4" y="14" font-family="sans-serif" font-size="12" font-weight="800" fill="#E2E8F0">Interactive Fluency Games:</text>
      
      <g transform="translate(0, 24)">
        <rect width="275" height="34" rx="8" fill="#1E293B" stroke="#475569"/>
        <text x="14" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">🎮 Game A: Word Scramble Challenge</text>
      </g>
      <g transform="translate(0, 64)">
        <rect width="275" height="34" rx="8" fill="#1E293B" stroke="#475569"/>
        <text x="14" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">🧩 Game B: Match Sound to Picture</text>
      </g>
      <g transform="translate(0, 104)">
        <rect width="275" height="34" rx="8" fill="#1E293B" stroke="#475569"/>
        <text x="14" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">⚡ Game C: Missing Word Speed Run</text>
      </g>
      <g transform="translate(0, 144)">
        <rect width="275" height="34" rx="8" fill="#1E293B" stroke="#475569"/>
        <text x="14" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">🎯 Game D: Spot the Grammatical Slip</text>
      </g>
    </g>

    <!-- Support Language Bridging -->
    <g transform="translate(20, 424)">
      <rect width="275" height="82" rx="12" fill="#312E81" stroke="#6366F1"/>
      <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#C7D2FE">
        🌐 Bilingual Explanation Support:
      </text>
      <text x="14" y="42" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">
        Telugu (మీ మాతృభాష) • Hindi (हिंदी)
      </text>
      <text x="14" y="60" font-family="sans-serif" font-size="11" font-weight="500" fill="#E0E7FF">
        Spanish • French • Japanese • German
      </text>
      <text x="14" y="74" font-family="sans-serif" font-size="9" fill="#A5B4FC">
        Explains English nuances in the student's mother tongue.
      </text>
    </g>
  </g>
</svg>

      <!-- Card 1 -->
      <rect width="226" height="150" rx="16" fill="#121216" stroke="rgba(255, 255, 255, 0.08)"/>
      <rect x="12" y="12" width="202" height="74" rx="10" fill="#1A1A22"/>
      <text x="113" y="52" font-family="sans-serif" font-size="12" font-weight="800" fill="#FF8533" text-anchor="middle">Thylakoid Diagram (D1)</text>
      <text x="14" y="110" font-family="sans-serif" font-size="12" font-weight="800" fill="#F8FAFC">Subtopic Accurate</text>
      <text x="14" y="130" font-family="sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Dedicated chemical schematics</text>

      <!-- Card 2 -->
      <g transform="translate(246, 0)">
        <rect width="226" height="150" rx="16" fill="#121216" stroke="rgba(255, 255, 255, 0.08)"/>
        <rect x="12" y="12" width="202" height="74" rx="10" fill="#1A1A22"/>
        <text x="113" y="52" font-family="sans-serif" font-size="12" font-weight="800" fill="#4ADE80" text-anchor="middle">Calvin Cycle (D2)</text>
        <text x="14" y="110" font-family="sans-serif" font-size="12" font-weight="800" fill="#F8FAFC">Stroma Carbon Fixation</text>
        <text x="14" y="130" font-family="sans-serif" font-size="10" font-weight="500" fill="#94A3B8">RuBisCO enzyme pathway</text>
      </g>
    </g>

    <!-- Dark Mode Tutor Preview -->
    <g transform="translate(24, 310)">
      <rect width="472" height="156" rx="16" fill="#121216" stroke="rgba(255, 255, 255, 0.08)"/>
      <rect x="16" y="14" width="80" height="24" rx="6" fill="rgba(255, 106, 0, 0.2)"/>
      <text x="56" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#FF6A00" text-anchor="middle">AI TUTOR</text>
      <text x="16" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">"Let's explore how chlorophyll traps light photons..."</text>
      <text x="16" y="84" font-family="sans-serif" font-size="11" font-weight="500" fill="#94A3B8">• Dark neutral high-contrast glass cards (#121216)</text>
      <text x="16" y="104" font-family="sans-serif" font-size="11" font-weight="500" fill="#94A3B8">• STUDYAI orange #FF6A00 preserved across all CTAs</text>
      <text x="16" y="124" font-family="sans-serif" font-size="11" font-weight="500" fill="#94A3B8">• Instant theme switcher in TopBrandBar &amp; Profile</text>
    </g>
  </g>
</svg>
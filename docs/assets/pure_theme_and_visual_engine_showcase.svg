      <text x="136" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">#000000 Base • #121216 Cards</text>
    </g>

    <!-- Simulated Dark UI: Topic Bar -->
    <g transform="translate(24, 68)">
      <rect width="472" height="54" rx="16" fill="#141418" stroke="#FF6A00" stroke-width="2"/>
      <rect x="10" y="9" width="36" height="36" rx="10" fill="rgba(255, 106, 0, 0.2)"/>
      <text x="28" y="32" font-family="sans-serif" font-size="18" font-weight="800" fill="#FF6A00" text-anchor="middle">+</text>
      <text x="58" y="32" font-family="sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">Photosynthesis &amp; Light Reactions</text>
      <rect x="372" y="9" width="90" height="36" rx="10" fill="url(#orangeGrad)"/>
      <text x="417" y="31" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Learn ✦</text>
    </g>


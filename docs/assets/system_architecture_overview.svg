<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#E85D00"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Badge -->
  <rect x="250" y="20" width="500" height="48" rx="24" fill="url(#headerGrad)" filter="url(#shadow)"/>
  <text x="500" y="51" fill="#FFFFFF" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="1">STUDYAI ADAPTIVE ECOSYSTEM ARCHITECTURE</text>

  <!-- Row 1: Frontend Clients -->
  <g transform="translate(40, 95)">
    <!-- Student App -->
    <rect x="0" y="0" width="280" height="145" rx="16" fill="url(#cardGrad)" stroke="#FF6A00" stroke-width="2" filter="url(#shadow)"/>
    <rect x="16" y="14" width="36" height="36" rx="8" fill="#FF6A00" fill-opacity="0.2"/>
    <text x="34" y="39" fill="#FF6A00" font-size="20" font-weight="bold" text-anchor="middle">📱</text>
    <text x="64" y="34" fill="#FFFFFF" font-size="15" font-weight="700">Student Application</text>
    <text x="64" y="52" fill="#94A3B8" font-size="11">Flutter (Android / iOS / Web PWA)</text>
    <text x="16" y="78" fill="#CBD5E1" font-size="11">• Apple Glass UI Design Tokens</text>
    <text x="16" y="96" fill="#CBD5E1" font-size="11">• Adaptive Profile Modal &amp; Depth Selector</text>
    <text x="16" y="114" fill="#CBD5E1" font-size="11">• AI Tutor, 3D Lab, Games, AI Notes</text>
    <text x="16" y="132" fill="#4ADE80" font-size="10" font-weight="700">✓ Interactive Understanding Checks</text>
    <rect x="195" y="12" width="70" height="20" rx="10" fill="#FF6A00" fill-opacity="0.2"/>
    <text x="230" y="26" fill="#FF6A00" font-size="10" font-weight="600" text-anchor="middle">studyai.com</text>

    <!-- Admin Portal -->
    <rect x="320" y="0" width="280" height="145" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="336" y="14" width="36" height="36" rx="8" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="354" y="39" fill="#38BDF8" font-size="20" font-weight="bold" text-anchor="middle">🛡️</text>
    <text x="384" y="34" fill="#FFFFFF" font-size="15" font-weight="700">Admin Portal</text>
    <text x="384" y="52" fill="#94A3B8" font-size="11">Flutter Web Dashboard</text>
    <text x="336" y="78" fill="#CBD5E1" font-size="11">• Curriculum, Classes &amp; Students</text>
    <text x="336" y="96" fill="#CBD5E1" font-size="11">• 40-Mark Exams &amp; Question Bank</text>
    <text x="336" y="114" fill="#CBD5E1" font-size="11">• Diagnostic Weakness Reports</text>
    <text x="336" y="132" fill="#38BDF8" font-size="10" font-weight="700">✓ Automated Multi-Tier Grading</text>
    <rect x="480" y="12" width="105" height="20" rx="10" fill="#38BDF8" fill-opacity="0.2"/>
    <text x="532" y="26" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="middle">admin.studyai.com</text>

    <!-- Super Admin Portal -->
    <rect x="640" y="0" width="280" height="145" rx="16" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="656" y="14" width="36" height="36" rx="8" fill="#A855F7" fill-opacity="0.2"/>
    <text x="674" y="39" fill="#A855F7" font-size="20" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="704" y="34" fill="#FFFFFF" font-size="15" font-weight="700">Super Admin Portal</text>
    <text x="704" y="52" fill="#94A3B8" font-size="11">Independent Isolated Web App</text>
    <text x="656" y="78" fill="#CBD5E1" font-size="11">• AI Provider Health &amp; Cost Meter</text>
    <text x="656" y="96" fill="#CBD5E1" font-size="11">• System Security &amp; Tenant Roles</text>
    <text x="656" y="114" fill="#CBD5E1" font-size="11">• Rate Limiting &amp; Kill-Switches</text>
    <text x="656" y="132" fill="#C084FC" font-size="10" font-weight="700">✓ Usage Quotas &amp; RLS Governance</text>
    <rect x="790" y="12" width="118" height="20" rx="10" fill="#A855F7" fill-opacity="0.2"/>
    <text x="849" y="26" fill="#A855F7" font-size="10" font-weight="600" text-anchor="middle">superadmin.studyai.com</text>
  </g>

  <!-- Connectors from Clients to Central API -->
  <path d="M 180 240 L 180 280 L 500 280" fill="none" stroke="#FF6A00" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 500 240 L 500 280" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 820 240 L 820 280 L 500 280" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 500 280 L 500 305" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Row 2: Central FastAPI Backend -->
  <g transform="translate(140, 305)">
    <rect x="0" y="0" width="720" height="120" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="#10B981" fill-opacity="0.2"/>
    <text x="40" y="48" fill="#10B981" font-size="24" font-weight="bold" text-anchor="middle">⚙️</text>
    <text x="76" y="42" fill="#FFFFFF" font-size="17" font-weight="700">Central Backend Engine — FastAPI (Python 3.11+) / Node.js Express Gateway</text>
    <text x="76" y="62" fill="#94A3B8" font-size="12">High-Throughput Asynchronous REST • SSE Streaming • WebSockets • Pydantic v2 &amp; TypeScript Contracts</text>
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="130" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="65" y="16" fill="#10B981" font-size="10" font-weight="700" text-anchor="middle">Adaptive AI Tutor</text>
      
      <rect x="140" y="0" width="130" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="205" y="16" fill="#10B981" font-size="10" font-weight="700" text-anchor="middle">40-Mark Mock Exams</text>
      
      <rect x="280" y="0" width="130" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="345" y="16" fill="#10B981" font-size="10" font-weight="700" text-anchor="middle">3 Educational Games</text>
      
      <rect x="420" y="0" width="125" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="482" y="16" fill="#10B981" font-size="10" font-weight="700" text-anchor="middle">Parent Dashboard</text>

      <rect x="555" y="0" width="125" height="24" rx="6" fill="#10B981" fill-opacity="0.2"/>
      <text x="617" y="16" fill="#10B981" font-size="10" font-weight="700" text-anchor="middle">Adaptive Profiles</text>
    </g>
  </g>

  <!-- Connectors from Backend to Core Services -->
  <path d="M 320 425 L 320 465 L 180 465 L 180 485" fill="none" stroke="#10B981" stroke-width="2"/>
  <path d="M 500 425 L 500 485" fill="none" stroke="#10B981" stroke-width="2"/>
  <path d="M 680 425 L 680 465 L 820 465 L 820 485" fill="none" stroke="#10B981" stroke-width="2"/>

  <!-- Row 3: Service Providers & Storage -->
  <g transform="translate(40, 485)">
    <!-- AI Orchestration -->
    <rect x="0" y="0" width="280" height="110" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="28" fill="#F59E0B" font-size="14" font-weight="700">🧠 Adaptive AI Pipeline</text>
    <text x="20" y="48" fill="#CBD5E1" font-size="11">• Local Ollama Qwen2.5 7B LLM</text>
    <text x="20" y="66" fill="#CBD5E1" font-size="11">• Groq / Gemini / OpenAI Fallback</text>
    <text x="20" y="84" fill="#CBD5E1" font-size="11">• Spelling Check &amp; Prerequisite Bridge</text>
    <text x="20" y="100" fill="#94A3B8" font-size="10">Zero Hallucination Grounded Engine</text>

    <!-- PostgreSQL & Supabase -->
    <rect x="320" y="0" width="280" height="110" rx="14" fill="url(#cardGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="340" y="28" fill="#3B82F6" font-size="14" font-weight="700">🗄️ PostgreSQL / Supabase</text>
    <text x="340" y="48" fill="#CBD5E1" font-size="11">• student_adaptive_profiles (Migration 009)</text>
    <text x="340" y="66" fill="#CBD5E1" font-size="11">• Strict Row Level Security (RLS) Isolation</text>
    <text x="340" y="84" fill="#CBD5E1" font-size="11">• Native Offline SQLite Synchronization</text>
    <text x="340" y="100" fill="#94A3B8" font-size="10">Encrypted Passwords &amp; Token Auth</text>

    <!-- Three.js 3D Lab Engine -->
    <rect x="640" y="0" width="280" height="110" rx="14" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="660" y="28" fill="#EC4899" font-size="14" font-weight="700">🧊 Three.js 3D Lab Engine</text>
    <text x="660" y="48" fill="#CBD5E1" font-size="11">• 8+ Interactive Scientific Models</text>
    <text x="660" y="66" fill="#CBD5E1" font-size="11">• 360° Orbit, Zoom &amp; Cross-Sections</text>
    <text x="660" y="84" fill="#CBD5E1" font-size="11">• Direct Game Launch Context Linking</text>
    <text x="660" y="100" fill="#94A3B8" font-size="10">WebGL 60fps Native Acceleration</text>
  </g>
</svg>

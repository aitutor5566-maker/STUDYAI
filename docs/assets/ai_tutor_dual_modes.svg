<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" style="background:#0F172A; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="modeAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="modeBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Sticky Top-Positioned Mode Selector (Apple Glass style) -->
  <g transform="translate(540, 40)" text-anchor="middle">
    <!-- Outer glass container -->
    <rect x="-380" y="-22" width="760" height="46" rx="23" fill="#1E293B" stroke="#334155" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Mode A Pill (Selected) -->
    <rect x="-374" y="-17" width="240" height="36" rx="18" fill="url(#modeAGrad)"/>
    <text x="-254" y="6" fill="#FFFFFF" font-size="12" font-weight="800">✨ NORMAL LEARNING MODE</text>

    <!-- Mode B Pill -->
    <rect x="-124" y="-17" width="240" height="36" rx="18" fill="#334155"/>
    <text x="-4" y="6" fill="#CBD5E1" font-size="12" font-weight="700">⚡ EXAM PREPARATION MODE</text>

    <!-- Learning Profile Button -->
    <rect x="126" y="-17" width="246" height="36" rx="18" fill="#581C87" stroke="#A855F7" stroke-width="1"/>
    <text x="249" y="6" fill="#E9D5FF" font-size="12" font-weight="800">⚙️ ADAPTIVE LEARNING PROFILE</text>
  </g>

  <!-- Sub-Controls: Explanation Depth & Language -->
  <g transform="translate(540, 88)" text-anchor="middle">
    <text x="-160" y="6" fill="#94A3B8" font-size="11" font-weight="600">Explanation Depth:</text>
    <rect x="-100" y="-10" width="60" height="22" rx="11" fill="#FF6A00"/>
    <text x="-70" y="5" fill="#FFFFFF" font-size="10" font-weight="800">⚡ Concise</text>
    <rect x="-34" y="-10" width="64" height="22" rx="11" fill="#334155"/>
    <text x="-2" y="5" fill="#CBD5E1" font-size="10" font-weight="700">⚖️ Balanced</text>
    <rect x="36" y="-10" width="60" height="22" rx="11" fill="#334155"/>
    <text x="66" y="5" fill="#CBD5E1" font-size="10" font-weight="700">🔍 Detailed</text>

    <text x="170" y="6" fill="#94A3B8" font-size="11" font-weight="600">Multilingual: English • తెలుగు • हिंदी</text>
  </g>

  <!-- Left Card: Mode A (Normal Learning & Concept Mastery) -->
  <g transform="translate(45, 115)">
    <rect x="0" y="0" width="475" height="415" rx="20" fill="url(#cardDark)" stroke="#FF6A00" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Header Badge -->
    <rect x="25" y="24" width="220" height="32" rx="16" fill="url(#modeAGrad)"/>
    <text x="135" y="45" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">MODE A — CONCEPT MASTERY</text>

    <text x="25" y="82" fill="#FFFFFF" font-size="15" font-weight="700">Everyday Explanations &amp; Adaptive Scaffolding</text>
    <text x="25" y="100" fill="#94A3B8" font-size="11">Designed for deep conceptual clarity, homework guidance, and visual learners</text>

    <!-- Feature List -->
    <g transform="translate(25, 115)">
      <!-- Feature 1 -->
      <circle cx="10" cy="10" r="5" fill="#FF6A00"/>
      <text x="25" y="14" fill="#CBD5E1" font-size="12" font-weight="700">Concise, Meaning-Preserving Explanations:</text>
      <text x="25" y="30" fill="#94A3B8" font-size="11">Removes fluff while strictly preserving 100% of the academic/scientific facts.</text>

      <!-- Feature 2 -->
      <circle cx="10" cy="52" r="5" fill="#FF6A00"/>
      <text x="25" y="56" fill="#CBD5E1" font-size="12" font-weight="700">Gentle Spelling &amp; Reading Scaffolding:</text>
      <text x="25" y="72" fill="#94A3B8" font-size="11">Supportive typo correction without shaming; shorter chunks for reading difficulties.</text>

      <!-- Feature 3 -->
      <circle cx="10" cy="94" r="5" fill="#FF6A00"/>
      <text x="25" y="98" fill="#CBD5E1" font-size="12" font-weight="700">Foundational Prerequisite Bridging:</text>
      <text x="25" y="114" fill="#94A3B8" font-size="11">Detects student weaknesses (e.g. Maths/Physics) and bridges prerequisite concepts first.</text>

      <!-- Feature 4 -->
      <circle cx="10" cy="136" r="5" fill="#FF6A00"/>
      <text x="25" y="140" fill="#CBD5E1" font-size="12" font-weight="700">Interactive 8-Part Explanation Format:</text>
      <text x="25" y="156" fill="#94A3B8" font-size="11">Title → Simple Definition → Mechanism → 3D/Diagram → Terms → Example → Check.</text>

      <!-- Feature 5 -->
      <circle cx="10" cy="178" r="5" fill="#FF6A00"/>
      <text x="25" y="182" fill="#CBD5E1" font-size="12" font-weight="700">Direct Educational Game Launch:</text>
      <text x="25" y="198" fill="#94A3B8" font-size="11">Launches Space Battle, Concept Duel, or Runner with topic context pre-filled.</text>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="25" y="355" width="425" height="38" rx="10" fill="#2E1065" stroke="#7C3AED" stroke-width="1"/>
    <text x="237" y="379" fill="#E9D5FF" font-size="12" font-weight="700" text-anchor="middle">🎮 Play Topic Game • 🧠 Memory Hooks • 🎯 Understanding Check</text>
  </g>

  <!-- Right Card: Mode B (Exam Preparation Mode) -->
  <g transform="translate(560, 115)">
    <rect x="0" y="0" width="475" height="415" rx="20" fill="url(#cardDark)" stroke="#38BDF8" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Header Badge -->
    <rect x="25" y="24" width="220" height="32" rx="16" fill="url(#modeBGrad)"/>
    <text x="135" y="45" fill="#FFFFFF" font-size="13" font-weight="800" text-anchor="middle">MODE B — EXAM PREPARATION</text>

    <text x="25" y="82" fill="#FFFFFF" font-size="15" font-weight="700">Formal Definitions, Full Forms &amp; 40-Mark Mock Tests</text>
    <text x="25" y="100" fill="#94A3B8" font-size="11">Designed for examination revision, board answer structuring &amp; score maximization</text>

    <!-- Feature List -->
    <g transform="translate(25, 115)">
      <!-- Feature 1 -->
      <circle cx="10" cy="10" r="5" fill="#38BDF8"/>
      <text x="25" y="14" fill="#CBD5E1" font-size="12" font-weight="700">Formal Examiner-Standard Definitions:</text>
      <text x="25" y="30" fill="#94A3B8" font-size="11">Strict textbook terminology, chemical formulas &amp; derivation equations.</text>

      <!-- Feature 2 -->
      <circle cx="10" cy="52" r="5" fill="#38BDF8"/>
      <text x="25" y="56" fill="#CBD5E1" font-size="12" font-weight="700">Full Forms &amp; Acronym Directory:</text>
      <text x="25" y="72" fill="#94A3B8" font-size="11">Comprehensive breakdowns of all curriculum abbreviations (DNA, ATP, mRNA, etc.).</text>

      <!-- Feature 3 -->
      <circle cx="10" cy="94" r="5" fill="#38BDF8"/>
      <text x="25" y="98" fill="#CBD5E1" font-size="12" font-weight="700">Writing Answer Structuring Guides:</text>
      <text x="25" y="114" fill="#94A3B8" font-size="11">Points, subheadings, and sentence starters to earn maximum board marks.</text>

      <!-- Feature 4 -->
      <circle cx="10" cy="136" r="5" fill="#38BDF8"/>
      <text x="25" y="140" fill="#CBD5E1" font-size="12" font-weight="700">40-Mark Weekly Examination Simulation:</text>
      <text x="25" y="156" fill="#94A3B8" font-size="11">Full 40-mark test engine with Options 1, 2, and 3 question structures.</text>

      <!-- Feature 5 -->
      <circle cx="10" cy="178" r="5" fill="#38BDF8"/>
      <text x="25" y="182" fill="#CBD5E1" font-size="12" font-weight="700">Weak-Area Diagnostic Remediation:</text>
      <text x="25" y="198" fill="#94A3B8" font-size="11">Detects subtopic deficiencies and re-drills them non-punitively until mastered.</text>
    </g>

    <!-- Bottom Action Pill -->
    <rect x="25" y="355" width="425" height="38" rx="10" fill="#0C4A6E" stroke="#0284C7" stroke-width="1"/>
    <text x="237" y="379" fill="#BAE6FD" font-size="12" font-weight="700" text-anchor="middle">🚀 Start 40-Mark Test • 📋 Save to AI Notes • 🛡️ Anti-Cheat Verified</text>
  </g>
</svg>
